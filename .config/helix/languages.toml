[[language]]
name = "nix"
formatter = { command = "nixfmt" }
auto-format = true

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true

[[language]]
name = "python"
# language-servers = ["pylsp", "ruff"]
# language-servers = ["pyrefly", "ruff"]
language-servers = ["ty", "ruff"]
# auto-format = true

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.ty.config]
inlayHints.callArgumentNames = false
experimental.rename = true
experimental.autoImport = true

[language-server.rust-analyzer.config.check]
command = "clippy"

[[language]]
name = "bash"
formatter = { command = "shfmt", args = ["-i", "2", "-"] }
auto-format = true

[[language]]
name = "typst"
soft-wrap.wrap-at-text-width = true
language-servers = ["tinymist", "harper-ls"]
auto-format = true

[[language]]
name = "markdown"
soft-wrap.wrap-at-text-width = true
comment-tokens = ["-", "+", "*", "- [ ]", ">"]
language-servers = ["marksman", "harper-ls"]
# language-servers = ["markdown-oxide"]

[[language]]
name = "rst"
language-servers = ["harper-ls"]

# [language-server.pyrefly]
# command = "pyrefly"
# args = ["lsp"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.tinymist]
command = "tinymist"
# config.preview.background.enabled = true
# config.preview.background.args = [
#   "--data-plane-host=127.0.0.1:0",
#   "--invert-colors=never",
#   "--open",
# ]
config.preview.browsing.args = [
  "--data-plane-host=127.0.0.1:0",
  "--invert-colors=never",
  "--open",
]
config.formatterMode = "typstyle"
config.lint.enabled = true
config.exportPdf = "onSave"

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[language-server.harper-ls.config.harper-ls]
diagnosticSeverity = "warning"
isolateEnglish = false
dialect = "American"
maxFileLength = 500000
ignoredLintsPath = []

[language-server.harper-ls.config.harper-ls.linters]
SpellCheck = true
SpelledNumbers = false
AnA = true
SentenceCapitalization = true
UnclosedQuotes = true
WrongQuotes = false
LongSentences = true
RepeatedWords = true
Spaces = true
Matcher = true
CorrectNumberSuffix = true

[language-server.harper-ls.config.harper-ls.codeActions]
ForceStable = false

[language-server.harper-ls.config.harper-ls.markdown]
IgnoreLinkTitle = false

[language-server.yaml-language-server.config.yaml]
format = { enable = true }
validation = true

[language-server.yaml-language-server.config.yaml.schemas]
"https://json.schemastore.org/github-action.json" = "/.github/**/actions.yml"
"https://json.schemastore.org/github-workflow.json" = "/.github/workflows/*.{yml,yaml}"
"https://raw.githubusercontent.com/prefix-dev/pixi/main/schema/schema.json" = "recipe.{yml,yaml}"

[language-server.yaml-language-server.config.yaml.schemaStore]
url = "https://json.schemastore.org/package.json"

[language-server.taplo]
config = {}
